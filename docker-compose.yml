services:
  postgres:
    image: postgres:15
    container_name: sintonar_postgres
    environment:
      POSTGRES_DB: sintonar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sintonar_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: .
    container_name: sintonar_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: .
    container_name: sintonar_celery
    command: celery -A sintonar worker -l info
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: sintonar_celery_beat
    command: celery -A sintonar beat -l info
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
